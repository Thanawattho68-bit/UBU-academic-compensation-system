<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ - ระบบค่าตอบแทนทางวิชาการ</title>
  <!-- Google Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=Sarabun:wght@300;400;500;600&display=swap"
    rel="stylesheet">
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="min-h-screen flex justify-center items-center p-5 bg-gradient-to-br from-[#1e3c72] to-[#2a5298]">
  <div class="w-full flex justify-center">
    <div class="bg-white/95 backdrop-blur-md shadow-[0_15px_35px_rgba(0,0,0,0.2)] rounded-[20px] p-10 w-full max-w-[550px]">
      <div class="text-center mb-[30px]">
        <img id="logo" class="w-[100px] h-auto mx-auto mb-5 block" src="{{ url_for('static', filename='image/Ubon_Ratchathani_Univ_Emblem.png') }}" alt="รูปม.อุบล">
        <h1 class="text-[1.5rem] text-ubu-primary mb-2.5 font-bold">ระบบค่าตอบแทนผู้มีตำแหน่งทางวิชาการ</h1>
        <p class="text-[0.9rem] text-[#7f8c8d]">สำหรับพนักงานมหาวิทยาลัยที่มีตำแหน่งทางวิชาการ</p>
      </div>

      <form method="POST" class="login-form">
        <div class="mb-5">
          <label for="username" class="block mb-2 font-semibold text-[#2c3e50]">ชื่อผู้ใช้</label>
          <div class="relative">
            <input class="peer w-full py-3 pr-[15px] pl-[45px] border-2 border-[#e0e0e0] rounded-xl text-base bg-[#f8f9fa] focus:border-[#3498db] focus:bg-white focus:outline-none focus:ring-[3px] focus:ring-[#3498db]/10 transition-colors" type="text" id="username" name="username" placeholder="Username" required>
            <i class="fa-solid fa-user absolute left-[15px] top-1/2 -translate-y-1/2 text-[#95a5a6] transition-colors duration-300 peer-focus:text-[#3498db]"></i>
          </div>
        </div>

        <div class="mb-5">
          <label for="password" class="block mb-2 font-semibold text-[#2c3e50]">รหัสผ่าน</label>
          <div class="relative">
            <input class="peer w-full py-3 pr-[15px] pl-[45px] border-2 border-[#e0e0e0] rounded-xl text-base bg-[#f8f9fa] focus:border-[#3498db] focus:bg-white focus:outline-none focus:ring-[3px] focus:ring-[#3498db]/10 transition-colors" type="password" id="password" name="password" placeholder="Password" required>
            <i class="fa-solid fa-lock absolute left-[15px] top-1/2 -translate-y-1/2 text-[#95a5a6] transition-colors duration-300 peer-focus:text-[#3498db]"></i>
          </div>
        </div>

        <button type="submit" class="w-full p-[14px] bg-gradient-to-br from-[#3498db] to-[#2980b9] hover:from-[#2980b9] hover:to-[#3498db] text-white rounded-xl text-[1.1rem] font-semibold flex justify-center items-center gap-2.5 shadow-[0_10px_20px_rgba(52,152,219,0.3)] hover:shadow-[0_15px_30px_rgba(52,152,219,0.4)] hover:-translate-y-[3px] active:-translate-y-[1px] transition-all duration-300 ease-[cubic-bezier(0.4,0,0.2,1)]">
          เข้าสู่ระบบ <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>

      {% with messages = get_flashed_messages() %}
      {% if messages %}
      <div class="mt-5 bg-ubu-danger text-white p-[15px] rounded-xl text-center">
        <i class="fa-solid fa-circle-exclamation"></i> {{ messages[0] }}
      </div>
      {% endif %}
      {% endwith %}
    </div>
  </div>
</body>

</html>
