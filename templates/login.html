<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>เข้าสู่ระบบ - ระบบค่าตอบแทนทางวิชาการ</title>
  <!-- Google Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body class="login-page">
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <img id="logo" src="{{ url_for('static', filename='image/Ubon_Ratchathani_Univ_Emblem.png') }}" alt="รูปม.อุบล">
        <h1>ระบบค่าตอบแทนผู้มีตำแหน่งทางวิชาการ</h1>
        <p>สำหรับพนักงานมหาวิทยาลัยที่มีตำแหน่งทางวิชาการ</p>
      </div>

      <form method="POST" class="login-form">
        <div class="form-control">
          <label for="username">ชื่อผู้ใช้</label>
          <div class="input-with-icon">
            <i class="fa-solid fa-user"></i>
            <input type="text" id="username" name="username" placeholder="Username" required>
          </div>
        </div>

        <div class="form-control">
          <label for="password">รหัสผ่าน</label>
          <div class="input-with-icon">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="password" name="password" placeholder="Password" required>
          </div>
        </div>

        <button type="submit" class="btn-login-submit">
          เข้าสู่ระบบ <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>

      {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
      <script>
        document.addEventListener('DOMContentLoaded',function(){
          var m = {{ messages | tojson | safe }};
          var last = m[m.length-1];
          var cat = last[0] || 'error';
          var msg = last[1];
          var icon = (cat === 'success') ? 'success' : 'error';
          var title = (cat === 'success') ? 'แจ้งเตือน' : 'เข้าสู่ระบบไม่สำเร็จ';
          Swal.fire({icon:icon, title:title, text:msg});
        });
      </script>
      {% endif %}
      {% endwith %}
    </div>
  </div>
</body>

</html>
