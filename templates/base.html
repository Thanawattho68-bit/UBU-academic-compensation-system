<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <title>{% block title %}ระบบค่าตอบแทน{% endblock %}</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700&display=swap"
      rel="stylesheet"
    />
    {% block extra_head %}{% endblock %}
  </head>

  <body class="bg-ubu-bg text-ubu-primary font-sans leading-relaxed">
    <div class="flex min-h-screen">
      {% include 'sidebar.html' %}
      
      <main class="flex-1 ml-[260px] flex flex-col min-w-0">
        <header class="bg-white h-[70px] flex items-center justify-end px-[40px] shadow-sm z-10 transition-all duration-300">
          <div class="text-[1.1rem] text-[#64748b] font-medium flex items-center gap-2.5">
            {% block top_bar_content %}
            <i class="fas fa-home"></i> หน้าหลัก
            {% endblock %}
          </div>
        </header>

        <section class="flex-1 p-[30px_40px] bg-[#e0e0e0] min-h-[calc(100vh-70px)]">
          {% block content %}{% endblock %}
        </section>
      </main>
    </div>
    <script src="{{ url_for('static', filename='notifications.js') }}"></script>
    {% block extra_scripts %}{% endblock %}
  </body>
</html>
