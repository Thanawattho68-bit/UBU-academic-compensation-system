<div class="form-group" style="margin-top: 15px; padding-top: 15px; border-top: 1px dashed #ddd;">
    <label style="color: #0056b3;"><i class="fas fa-folder-open"></i> หลักฐานของผลงานนี้ (Evidence for this work)</label>
    <div style="display: flex; gap: 20px; margin-bottom: 15px; background: #f8fbff; padding: 12px; border-radius: 8px; border: 1px solid #e0e9f5;">
        <div style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
            <input type="radio" name="evidence_type_{{ work.id }}" id="type_link_{{ work.id }}" value="link" {% if work.evidence_type != 'file' %}checked{% endif %} onchange="toggleEvidenceSource('{{ work.id }}', 'link')" style="cursor: pointer; margin: 0;">
            <label for="type_link_{{ work.id }}" style="cursor: pointer; margin: 0; font-weight: 500;">แนบลิงก์หลักฐาน (Link)</label>
        </div>
        <div style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
            <input type="radio" name="evidence_type_{{ work.id }}" id="type_file_{{ work.id }}" value="file" {% if work.evidence_type == 'file' %}checked{% endif %} onchange="toggleEvidenceSource('{{ work.id }}', 'file')" style="cursor: pointer; margin: 0;">
            <label for="type_file_{{ work.id }}" style="cursor: pointer; margin: 0; font-weight: 500;">อัปโหลดไฟล์ (File Upload)</label>
        </div>
    </div>

    <div id="evidence_link_container_{{ work.id }}" style="display:{% if work.evidence_type != 'file' %}block{% else %}none{% endif %};">
        <div style="font-size: 0.85em; color: #555;">
            <i class="fas fa-link"></i> ลิงก์ผลงานเเละหลักฐาน (เช่น Google Drive, Dropbox, หรือลิงก์จากวารสาร/สำนักพิมพ์)
        </div>
        <input type="url" class="evidence-url-input form-control" placeholder="https://..." onchange="updateWork('{{ work.id }}', 'evidence_url', this.value)" {% if work.evidence_type != 'file' %}required{% endif %} value="{{ work.evidence_url|default('') }}" style="width:100%">
    </div>

    <div id="evidence_file_container_{{ work.id }}" style="display:{% if work.evidence_type == 'file' %}block{% else %}none{% endif %};">
        <div style="font-size: 0.8em; color: #666;">อัปโหลดไฟล์หลักฐาน (จำกัดเฉพาะ pdf, doc, docx, zip, rar)</div>
        <input type="file" name="evidence_file_{{ work.id }}" accept=".pdf,.doc,.docx,.zip,.rar" style="width:100%; padding: 5px;" class="form-control evidence-file-input" onchange="checkFileSize(this)" {% if work.evidence_type == 'file' and not work.evidence_file %}required{% endif %}>
        {% if work.evidence_file %}
        <div class="existing-file-info" style="margin-top: 5px; font-size: 0.9em; color: #27ae60;">
            <i class="fas fa-check-circle"></i> ไฟล์ปัจจุบัน: {{ work.evidence_file }}
        </div>
        {% endif %}
    </div>
</div>
